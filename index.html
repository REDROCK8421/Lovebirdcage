<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>버드케이지 라운지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: a full-screen 3D bar at night with floating brass-trimmed HUD; entrance is a dressing room (live 3D preview + wardrobe sheet) */
:root{
  --ink:#140f19;
  --panel:#1f1826;
  --panel-2:#2a2132;
  --line:#3e3248;
  --fg:#f3ebe1;
  --muted:#b6a7b1;
  --brass:#d6a84c;
  --brass-hi:#f1d08a;
  --wine:#8e2f47;
  --good:#7fcf9e;
  --display:'Nanum Myeongjo','Batang','Times New Roman',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

#world{position:fixed;inset:0}
#world canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform}
.tag .name{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(20,15,25,.72);border:1px solid rgba(214,168,76,.35);white-space:nowrap;letter-spacing:.01em}
.tag.me .name{background:var(--brass);color:#1b130a;border-color:var(--brass-hi)}
.tag.npc .name{border-style:dashed}
.tag.sign .name{background:rgba(20,15,25,.55);border-color:rgba(255,255,255,.18);font-weight:500;font-size:11.5px}
.tag.sign.dark .name{border-color:rgba(255,90,120,.55);color:#ffc2cf}
.tag .bubble{max-width:200px;font-size:13px;line-height:1.4;padding:7px 11px;border-radius:14px;background:#f6efe4;color:#24181c;box-shadow:0 6px 18px rgba(0,0,0,.35);word-break:keep-all;overflow-wrap:anywhere;text-align:center}
.tag .bubble.dark{background:#2b0f19;color:#ffd9e2;border:1px solid #7a2a40}
.float{position:absolute;font-family:var(--display);font-size:26px;color:var(--brass-hi);transform:translate(-50%,-100%);animation:floatUp 1.6s ease-out forwards;text-shadow:0 0 12px rgba(241,208,138,.7)}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}

.hud-top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-top > *{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--brass-hi);text-shadow:0 0 18px rgba(214,168,76,.45);margin-right:auto;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(31,24,38,.82);border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.ibtn{border:1px solid var(--line);background:rgba(31,24,38,.82);border-radius:10px;padding:7px 11px;font-size:12px}
.ibtn:hover{border-color:var(--brass)}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast{font-size:13px;padding:7px 14px;border-radius:999px;background:rgba(246,239,228,.92);color:#24181c;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:toastIn .25s ease-out;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.hud-bottom > *{pointer-events:auto}
.emotes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.emotes button{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(31,24,38,.86)}
.emotes button:hover{border-color:var(--brass);color:var(--brass-hi)}
.emotes button.ctx{border-color:var(--brass);color:var(--brass-hi)}
.chatbar{display:flex;gap:6px;width:min(100%,560px);background:rgba(31,24,38,.9);border:1px solid var(--line);border-radius:14px;padding:6px}
.chatbar.dark{border-color:#7a2a40;background:rgba(43,15,25,.92)}
.chatbar input{flex:1;min-width:0;background:transparent;border:0;padding:8px 10px;font-size:15px;outline:none}
.chatbar input::placeholder{color:var(--muted)}
.btn-brass{background:var(--brass);color:#1b130a;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.btn-brass:hover:not(:disabled){background:var(--brass-hi)}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn-ghost:hover:not(:disabled){border-color:var(--brass)}
.hint{font-size:11.5px;color:var(--muted);text-align:center}

#log{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 64px);width:min(300px,calc(100vw - 32px));max-height:42vh;overflow-y:auto;background:rgba(20,15,25,.86);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
#log .line b{color:var(--brass-hi);font-weight:600;margin-right:6px}
#log .line.mine b{color:var(--good)}
#log .empty{color:var(--muted)}

.card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 220px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--display);font-size:18px;color:var(--brass-hi);padding-right:24px}
.card .sub{font-size:12px;color:var(--muted);margin-top:-6px;line-height:1.5}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.card .row button{flex:1 1 auto}
.drinks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drinks button{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:13px}
.drinks button small{display:block;color:var(--muted);font-size:11px}
.drinks button:hover{border-color:var(--brass)}
.xclose{position:absolute;top:8px;right:10px;background:none;border:0;font-size:20px;color:var(--muted);line-height:1}

.dtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.dtable th{font-weight:500;color:var(--muted);font-size:11.5px}
.dtable td:first-child,.dtable th:first-child{text-align:left}
.dtable tr.turn td{color:var(--brass-hi);font-weight:600}
.dtable .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:13px}
.slot.empty{color:var(--muted);border-style:dashed;background:transparent}
.slot .sw{width:10px;height:10px;border-radius:50%}

#aim{position:fixed;inset:0;background:rgba(10,7,12,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#aim canvas{width:min(88vw,62vh);height:min(88vw,62vh);touch-action:none;cursor:crosshair}
#aim .info{font-size:14px;color:var(--fg);text-align:center}
#aim .result{font-family:var(--display);font-size:28px;color:var(--brass-hi);min-height:36px}

.modal-bg{position:fixed;inset:0;background:rgba(10,7,12,.6);display:grid;place-items:center;padding:16px}
.modal{width:min(360px,100%);background:var(--panel);border:1px solid var(--brass);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.modal.vers{border-color:#6aa0ff}
.modal h3{margin:0;font-family:var(--display);font-size:20px;color:var(--brass-hi)}
.modal.vers h3{color:#a9c6ff;letter-spacing:.18em}
.modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.modal .row{display:flex;gap:8px;justify-content:center}
.btn-open{background:#2b3d66;border:1px solid #6aa0ff;color:#dce8ff;border-radius:12px;padding:12px 18px;font-weight:600;letter-spacing:.12em}

#oneshot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(340px,calc(100vw - 32px));height:min(440px,58vh);background:var(--panel);border:1px solid var(--wine);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#oneshot header{padding:12px 14px;background:linear-gradient(180deg,rgba(142,47,71,.45),rgba(142,47,71,.1));display:flex;align-items:center;gap:8px}
#oneshot header h3{margin:0;font-family:var(--display);font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#oneshot .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.pm{max-width:80%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.pm.me{align-self:flex-end;background:var(--brass);color:#1b130a;border-bottom-right-radius:4px}
.pm.them{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.pm.sys{align-self:center;background:none;color:var(--muted);font-size:12px;text-align:center}
#oneshot form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#oneshot input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
body.in-oneshot .hud-bottom .chatbar{display:none}
body.in-dark .brand{color:#ff9fb4;text-shadow:0 0 18px rgba(255,80,120,.5)}

#entrance{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:radial-gradient(ellipse at 30% 40%,#3a2340 0%,var(--ink) 65%)}
#entrance .stage{position:relative;min-width:0;min-height:0}
#preview{position:absolute;inset:0}
#preview canvas{width:100%;height:100%;display:block;touch-action:none}
.stage .title{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 22px);pointer-events:none}
.stage .title .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
.stage .title h1{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,46px);line-height:1.1;color:var(--brass-hi);text-wrap:balance;text-shadow:0 0 30px rgba(214,168,76,.35)}
.stage .title p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:34ch}
.stage .spin{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.wardrobe{min-width:0;min-height:0;overflow-y:auto;background:rgba(31,24,38,.92);border-left:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wardrobe h2{margin:0;font-family:var(--display);font-size:22px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec > label,.sec > .lbl{font-size:11.5px;letter-spacing:.12em;color:var(--brass);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 13px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--brass);color:#1b130a;border-color:var(--brass-hi);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.12);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--brass-hi);outline-offset:2px}
.nick{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.nick:focus{border-color:var(--brass)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.5}
.agree input{margin-top:3px;accent-color:var(--brass);width:16px;height:16px}
.enter-row{display:flex;gap:8px;position:sticky;bottom:0;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(31,24,38,.98) 30%)}
.enter-row .btn-brass{flex:1;padding:13px 16px;font-size:15px}
.sub2{display:flex;flex-direction:column;gap:6px;margin-top:4px}

@media (max-width:760px){
  #entrance{grid-template-columns:1fr;grid-template-rows:40vh minmax(0,1fr)}
  .wardrobe{border-left:0;border-top:1px solid var(--line);padding-top:18px}
  .stage .title p{display:none}
  .emotes button{padding:6px 9px}
  .card{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-height:calc(100vh - 240px)}
  #oneshot{left:max(16px,env(safe-area-inset-left,0px));width:auto;height:min(380px,50vh)}
  .brand span{display:none}
  .hint#moveHint{display:none}
}
@media (prefers-reduced-motion:reduce){.float,.toast{animation:none}}
</style>
</head>
<body>

<div id="world" hidden></div>
<div id="tags" hidden></div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 2v2.5"/><path d="M6 11a6 6 0 0 1 12 0v9H6z"/><path d="M9 6.2V20M12 5v15M15 6.2V20"/><path d="M4.5 20h15"/></svg><span>버드케이지</span></div>
    <span class="chip" id="zoneChip">라운지</span>
    <span class="chip"><span class="dot" id="connDot"></span><span id="countChip">1명</span></span>
    <button class="ibtn" id="muteBtn" type="button" hidden>음악 끄기</button>
    <button class="ibtn" id="logBtn" type="button">대화 기록</button>
    <button class="ibtn" id="dressBtn" type="button">옷 갈아입기</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="log" hidden></div>
  <div class="hud-bottom">
    <div class="emotes" id="emotes"></div>
    <form class="chatbar" id="chatForm">
      <input id="chatInput" maxlength="140" autocomplete="off" placeholder="라운지에 한마디…" aria-label="채팅">
      <button class="btn-brass" type="submit">보내기</button>
    </form>
    <div class="hint" id="moveHint">바닥을 탭해 이동 · 드래그로 시점 회전 · 의자·바텐더·다트판·문을 탭해 보세요</div>
  </div>
</div>

<div class="card" id="card" hidden></div>

<div id="aim" hidden>
  <div class="info" id="aimInfo">조준이 흔들려요. 원하는 순간에 탭하세요.</div>
  <canvas id="aimCanvas" width="600" height="600" aria-label="다트 조준판"></canvas>
  <div class="result" id="aimResult"></div>
  <button class="btn-ghost" id="aimClose" type="button">닫기</button>
</div>

<div id="oneshot" hidden>
  <header><h3 id="osTitle">원샷 룸</h3><button class="btn-ghost" id="osLeave" type="button">나가기</button></header>
  <div class="msgs" id="osMsgs"></div>
  <form id="osForm"><input id="osInput" maxlength="300" autocomplete="off" placeholder="둘만의 대화…" aria-label="원샷 룸 메시지"><button class="btn-brass" type="submit">보내기</button></form>
</div>

<div class="modal-bg" id="modal" hidden><div class="modal" id="modalBox"></div></div>

<section id="entrance">
  <div class="stage">
    <div id="preview"></div>
    <div class="title">
      <div class="eyebrow">Online Lounge · 19+</div>
      <h1>오늘 밤,<br>버드케이지</h1>
      <p>입장 전에 오늘의 모습을 골라 주세요. 얼굴 사진 없이 캐릭터로 만나요.</p>
    </div>
    <div class="spin">드래그해서 돌려보기</div>
  </div>
  <div class="wardrobe">
    <h2>드레스룸</h2>
    <div class="sec"><label for="nick">닉네임</label><input class="nick" id="nick" maxlength="12" placeholder="2~12자" autocomplete="off"></div>
    <div class="sec"><div class="lbl">체형</div><div class="chips" data-k="body"></div></div>
    <div class="sec"><div class="lbl">피부톤</div><div class="sw" data-k="skin"></div></div>
    <div class="sec"><div class="lbl">헤어</div><div class="chips" data-k="hair"></div><div class="sw" data-k="hairColor"></div></div>
    <div class="sec"><div class="lbl">수염</div><div class="chips" data-k="beard"></div></div>
    <div class="sec"><div class="lbl">의상</div><div class="chips" data-k="outfit"></div>
      <div class="sub2"><span class="hint" style="text-align:left">상의 색</span><div class="sw" data-k="top"></div><span class="hint" style="text-align:left">하의 색</span><div class="sw" data-k="bottom"></div></div></div>
    <div class="sec"><div class="lbl">액세서리 · 여러 개 선택</div><div class="chips" data-k="acc"></div></div>
    <label class="agree"><input type="checkbox" id="adult"> 만 19세 이상이며, 매너 가이드(동의 없는 사진·금전 요구 금지, 다른 회원 신상 공개 금지)를 지킬게요.</label>
    <div class="enter-row"><button class="btn-ghost" id="randBtn" type="button">랜덤</button><button class="btn-brass" id="enterBtn" type="button" disabled>입장하기</button></div>
    <div class="hint" style="text-align:left">대화는 지금 접속한 사람에게만 전달되고, 다크룸·원샷 룸 대화는 그 방 사람만 볼 수 있어요.</div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* Firebase Realtime Database adapter exposing the small room API the page uses */
window.makeFirebaseRoom = async function(){
  const cfg = window.FIREBASE_CONFIG || {};
  if(!window.firebase || !cfg.apiKey || /^YOUR/.test(cfg.apiKey)) throw new Error('no-config');
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const cred = await firebase.auth().signInAnonymously();
  const uid = cred.user.uid;
  const db = firebase.database();
  const SV = firebase.database.ServerValue.TIMESTAMP;
  const offSnap = await db.ref('.info/serverTimeOffset').once('value');
  let offset = offSnap.val() || 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  const now = () => Date.now() + offset;

  const meRef = db.ref('lounge/players/' + uid);
  let lastPres = null, conn = false;
  const connFns = [], peerFns = [], handlers = {};
  const peers = new Map();
  const selfPeer = () => ({peer:uid, sameTab:true, isMe:true, kind:'viewer', presence:lastPres || {}});
  const fire = (joined=[], left=[], updated=[]) => { const list=[selfPeer(), ...peers.values()]; peerFns.forEach(f=>f({peers:list, joined, left, updated})); };

  db.ref('.info/connected').on('value', s => {
    conn = !!s.val();
    if(conn){ meRef.onDisconnect().remove(); if(lastPres) meRef.set(Object.assign({}, lastPres, {t:SV})); }
    connFns.forEach(f=>f(conn));
  });
  const pref = db.ref('lounge/players');
  const asPeer = s => ({peer:s.key, sameTab:false, isMe:false, kind:'viewer', presence:s.val() || {}});
  pref.on('child_added', s => { if(s.key===uid) return; const v=s.val()||{}; if(v.t && now()-v.t > 30*60*1000) return; const p=asPeer(s); peers.set(s.key,p); fire([p]); });
  pref.on('child_changed', s => { if(s.key===uid) return; const p=asPeer(s); peers.set(s.key,p); fire([],[],[p]); });
  pref.on('child_removed', s => { if(s.key===uid) return; const p=peers.get(s.key); if(p){ peers.delete(s.key); fire([],[p]); } });

  const evRef = db.ref('lounge/events');
  evRef.orderByChild('t').startAt(now()).on('child_added', s => {
    const v = s.val(); if(!v || !handlers[v.type]) return;
    const msg = {topic:v.type, peer:v.from, sameTab:v.from===uid, isMe:v.from===uid, kind:'viewer', data:v.data || {}};
    handlers[v.type].slice().forEach(f=>{ try{ f(msg); }catch(e){ console.error(e); } });
  });
  evRef.orderByChild('t').endAt(now()-120000).limitToFirst(100).once('value').then(s=>{ s.forEach(c=>{ c.ref.remove().catch(()=>{}); }); }).catch(()=>{});

  const on = (map) => (topic, fn) => { (map[topic] = map[topic] || []).push(fn); return () => { map[topic] = (map[topic]||[]).filter(x=>x!==fn); }; };

  async function emit(topic, data){
    data = data || {};
    if(topic==='invite'){ await db.ref('invites/' + data.code).set({a:uid, b:String(data.to||''), t:SV}); }
    await evRef.push({type:topic, from:uid, data, t:SV});
  }

  async function join(code){
    const base = db.ref('oneshot/' + code);
    const myM = base.child('members/' + uid);
    await myM.set(true); myM.onDisconnect().remove();
    const h = {}, pf = [], members = new Map();
    const msgsQ = base.child('msgs').orderByChild('t');
    const onMsg = s => { const v=s.val(); if(!v) return; const msg={topic:'pm', peer:v.from, sameTab:v.from===uid, isMe:v.from===uid, kind:'viewer', data:{text:v.text}}; (h.pm||[]).slice().forEach(f=>f(msg)); };
    msgsQ.on('child_added', onMsg);
    const mref = base.child('members');
    const mp = k => ({peer:k, sameTab:k===uid, isMe:k===uid, kind:'viewer', presence:{}});
    const mfire = (j=[],l=[]) => { const list=[...members.values()]; pf.forEach(f=>f({peers:list, joined:j, left:l, updated:[]})); };
    const ma = s => { const p=mp(s.key); members.set(s.key,p); mfire([p]); };
    const mr = s => { const p=members.get(s.key); members.delete(s.key); if(p) mfire([],[p]); };
    mref.on('child_added', ma); mref.on('child_removed', mr);
    return {
      name: code,
      emit: (t, d) => t==='pm' ? base.child('msgs').push({from:uid, text:String((d||{}).text||'').slice(0,300), t:SV}) : Promise.resolve(),
      on: on(h),
      onPeers: fn => { pf.push(fn); return () => {}; },
      presence: () => Promise.resolve(),
      connected: () => conn,
      leave: async () => { msgsQ.off('child_added', onMsg); mref.off('child_added', ma); mref.off('child_removed', mr); myM.onDisconnect().cancel(); await myM.remove(); }
    };
  }

  return {
    uid, emit, on: on(handlers), fb:{db, uid, SV, now},
    presence: p => { lastPres = Object.assign({}, lastPres, p); return meRef.set(Object.assign({}, lastPres, {t:SV})); },
    onPeers: fn => { peerFns.push(fn); setTimeout(()=>{ const list=[selfPeer(), ...peers.values()]; fn({peers:list, joined:list, left:[], updated:[]}); },0); return () => {}; },
    onConnection: fn => { connFns.push(fn); setTimeout(()=>fn(conn),0); return () => {}; },
    connected: () => conn,
    join
  };
};

function animChar(ent, dt, t){
  const P = ent.root.userData.parts; const a = ent.anim;
  ent.phase = (ent.phase||0) + dt*(a==='walk'?10:3);
  let leg=0, ax=[0,0], az=[0,0], bob=0, sway=0, lean=0, sit=0, legX=0;
  if(a==='walk'){ leg=Math.sin(ent.phase)*.7; ax=[leg*.8,-leg*.8]; bob=Math.abs(Math.sin(ent.phase))*.06; }
  else if(a==='dance'){ const s=Math.sin(t*7); bob=Math.abs(s)*.13; az=[-1.6-s*.5,1.6+s*.5]; sway=Math.sin(t*3.5)*.5; leg=s*.3; }
  else if(a==='wave'){ az=[0,2.6+Math.sin(t*12)*.35]; ax=[0,-.2]; }
  else if(a==='cheers'){ ax=[0,-2.2]; bob=Math.abs(Math.sin(t*3))*.02; }
  else if(a==='bow'){ lean=.5; ax=[.2,.2]; }
  else if(a==='heart'){ az=[-2.2,2.2]; ax=[-.6,-.6]; bob=Math.abs(Math.sin(t*4))*.04; }
  else if(a==='mix'){ const s=Math.sin(t*22); ax=[-1.4+s*.25,-1.4-s*.25]; az=[-.3,.3]; }
  else if(a==='throw'){ const p=((ent.animUntil||0)-performance.now())/700; ax=[0, p>.45? -2.6 : -1.2]; lean = p>.45? -.08 : .12; }
  else if(a==='sit'){ sit=-.24; legX=-1.45; ax=[-.35,-.35]; }
  else { bob=Math.sin(t*2+(ent.seed||0))*.012; }
  const holding = !!ent.hold;
  if(holding && a==='sit') ax[1] = -1.0;
  else if(holding && !['cheers','dance','wave','throw','heart'].includes(a)) ax[1] = Math.min(ax[1], -1.1);
  P.rig.position.y = bob + sit; P.rig.rotation.y = sway*.4; P.rig.rotation.x = lean;
  P.legs[0].rotation.x = legX || leg; P.legs[1].rotation.x = legX || -leg;
  P.arms[0].rotation.x = ax[0]; P.arms[1].rotation.x = ax[1];
  P.arms[0].rotation.z = az[0]; P.arms[1].rotation.z = az[1];
  const want = holding ? ent.hold : (a==='cheers' ? 'beer' : null);
  setHeldModel(ent, want); P.glass.visible = !!want; P.glass.rotation.set(-ax[1], 0, -az[1]);
}

const Music = (()=>{
  let ctx=null, master=null, timer=null, on=false, muted=false, step=0, nextT=0;
  const f = m => 440*Math.pow(2,(m-69)/12);
  const chords=[[57,60,64,67,71],[53,57,60,64,67],[50,53,57,60,64],[52,56,59,62,65]];
  function ensure(){
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    if(!ctx){ ctx=new AC(); master=ctx.createGain(); master.gain.value=0; const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function pad(ch,t,dur){
    const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.Q.value=5;
    filt.frequency.setValueAtTime(380,t); filt.frequency.linearRampToValueAtTime(1150,t+dur*.55); filt.frequency.linearRampToValueAtTime(420,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+1.4); g.gain.linearRampToValueAtTime(0,t+dur+.6);
    filt.connect(g); g.connect(master);
    for(const n of ch) for(const d of [-7,7]){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f(n-12); o.detune.value=d; o.connect(filt); o.start(t); o.stop(t+dur+.7); }
  }
  function bass(n,t,v=.32){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f(n-24)*1.8,t); o.frequency.exponentialRampToValueAtTime(f(n-24),t+.07); const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.55); o.connect(g); g.connect(master); o.start(t); o.stop(t+.6); }
  function hat(t,v=.035){ const len=.06, buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*len),ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); const s=ctx.createBufferSource(); s.buffer=buf; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6500; const g=ctx.createGain(); g.gain.value=v; s.connect(hp); hp.connect(g); g.connect(master); s.start(t); }
  function bell(n,t){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f(n+12); const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+1.6); const dl=ctx.createDelay(); dl.delayTime.value=.42; const fb=ctx.createGain(); fb.gain.value=.35; o.connect(g); g.connect(master); g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master); o.start(t); o.stop(t+1.7); }
  const half = 60/66/2;
  function sched(){
    while(nextT < ctx.currentTime + .7){
      const bar=Math.floor(step/8), ch=chords[bar%4], s=step%8;
      if(s===0) pad(ch,nextT,half*8);
      if(s===0) bass(ch[0],nextT); if(s===3) bass(ch[0],nextT,.2); if(s===4) bass(ch[0]+7,nextT,.22);
      if(s%2===1) hat(nextT); if(s===6) hat(nextT,.02);
      if(s===2 && bar%2===1) bell(ch[2+(bar%3)],nextT);
      nextT += half; step++;
    }
  }
  return {
    unlock(){ ensure(); },
    start(){ if(!ensure() || on) return; on=true; step=0; nextT=ctx.currentTime+.1; const n=ctx.currentTime; master.gain.cancelScheduledValues(n); master.gain.setValueAtTime(master.gain.value,n); master.gain.linearRampToValueAtTime(muted?0:.9,n+2.5); clearInterval(timer); timer=setInterval(sched,150); sched(); },

    get muted(){ return muted; }
  };
})();

  scene.add(M(new THREE.BoxGeometry(w,3.6,.3), dw, cx,1.8,DARK.z1-.45));

  scene.add(M(new THREE.BoxGeometry(.9,.42,2.4), velvet, DARK.x1+.15,.21,-1.9)); scene.add(M(new THREE.BoxGeometry(.25,.8,2.4), velvet2, DARK.x1-.2,.52,-1.9));
  addObs(DARK.x1-.4,-3.1,DARK.x1+.6,-.7,DOBS);
  for(const z of [-2.45,-1.35]) addSeat({x:DARK.x1+.3, z, ry:Math.PI/2, top:.42, y:.31, ax:DARK.x1+1.25, az:z, label:'다크룸 소파', dark:true});

  const fr = mat('#2a0d18',.5);

  cur.rotation.y=Math.PI/2; cur.position.set(-10.08,1.45,(DARK.doorZ1+DARK.doorZ2)/2); const p=cur.geometry.attributes.position; for(let i=0;i<p.count;i++) p.setZ(i,Math.sin(p.getX(i)*18)*.05); p.needsUpdate=true; cur.geometry.computeVertexNormals(); scene.add(cur);
  doorDark = cur; doorDark.userData.door='dark';

  sg.rotation.y=Math.PI/2; sg.position.set(-9.88,3.0,(DARK.doorZ1+DARK.doorZ2)/2); scene.add(sg);

function makeDart(color){
  const g = new THREE.Group();
  g.add(M(G.cyl(.004,.004,.05,6), mat('#cfd3da',.2,.9), 0,0,0).rotateZ(Math.PI/2).translateY(.025));
  g.add(M(G.cyl(.01,.008,.08,8), mat('#2a2a30',.3,.6), -.09,0,0).rotateZ(Math.PI/2));
  const fl = M(new THREE.BoxGeometry(.05,.05,.003), mat(color,.6), -.15,0,0); g.add(fl); const fl2=fl.clone(); fl2.rotation.x=Math.PI/2; g.add(fl2);
  return g;
}
function makeSign(text,x,y,z,cls,id){
  const tag=document.createElement('div'); tag.className='tag sign '+cls; const n=document.createElement('div'); n.className='name'; n.textContent=text; if(id) n.id=id; tag.appendChild(n); $('#tags').appendChild(tag);
  return {x,y,z,tag};
}

/* ================= Entities ================= */
function makeEntity({nick, look, npc=false, mine=false, peer=null}){
  const root = makeChar(look); scene.add(root);
  const tag = document.createElement('div'); tag.className='tag'+(mine?' me':'');
  const bubble = document.createElement('div'); bubble.className='bubble'; bubble.hidden=true;
  const name = document.createElement('div'); name.className='name'; name.textContent = nick;
  tag.append(bubble,name); $('#tags').appendChild(tag);
  const L = sanitizeLook(look);
  const ent = {root, tag, bubble, nameEl:name, nick, look:L, lookKey:JSON.stringify(L), npc, mine, peer, x:0,z:0,ry:0, tx:0,tz:0,tr:0, anim:'idle', phase:0, seed:Math.random()*6, hold:null, bubbleT:0, seat:-1, cd:null, cdMesh:null, dk:false};
  root.traverse(o=>{ o.userData.ent = ent; });
  return ent;
}
function rebuildLook(ent, look){
  const L=sanitizeLook(look); const key=JSON.stringify(L); if(key===ent.lookKey) return;
  const vis = ent.root.visible; scene.remove(ent.root); const root=makeChar(L); root.visible=vis; scene.add(root); root.traverse(o=>{ o.userData.ent=ent; }); ent.root=root; ent.look=L; ent.lookKey=key;
}
function removeEntity(ent){ scene.remove(ent.root); if(ent.cdMesh) scene.remove(ent.cdMesh); ent.tag.remove(); }
function say(ent, text, dark){
  if(!ent) return; ent.bubble.textContent = text; ent.bubble.classList.toggle('dark', !!dark); ent.bubble.hidden=false; ent.bubbleT = performance.now() + Math.min(9000, 3500 + text.length*90);
}
function floatAt(ent, ch){
  const v = new THREE.Vector3(ent.x, 1.9+groundY(ent.x,ent.z), ent.z).project(camera);
  const el=document.createElement('div'); el.className='float'; el.textContent=ch;
  el.style.left = ((v.x+1)/2*innerWidth)+'px'; el.style.top = ((1-v.y)/2*innerHeight)+'px';
  $('#tags').appendChild(el); setTimeout(()=>el.remove(),1700);
}
function setCounterDrink(ent, cd){
  const key = cd ? cd.k+'@'+cd.x : '';
  if(ent.cdKey===key) return; ent.cdKey=key;
  if(ent.cdMesh){ scene.remove(ent.cdMesh); ent.cdMesh=null; }
  ent.cd = cd || null;
  if(cd && DRINKS.some(d=>d[0]===cd.k)){
    const m = makeCounterSet(cd.k); m.position.set(clamp(+cd.x||0,-8,.8), 1.13, -5.55);
    if(ent.mine) m.traverse(o=>{ o.userData.myDrink=true; });
    scene.add(m); ent.cdMesh=m;
  }
}

const EMOTES = [['wave','손 흔들기','님이 손을 흔들었어요'],['cheers','건배','님이 잔을 들어 건배했어요'],['dance','춤','님이 춤을 추기 시작했어요'],['heart','하트','님이 하트를 날렸어요'],['bow','인사','님이 정중하게 인사했어요'],['sit','앉기','님이 자리에 앉았어요']];
function renderEmotes(){
  const box=$('#emotes'); box.textContent='';

function doEmote(k){
  if(k==='sit'){ sitNearest(); return; }

  if(room && connected && !me.dk) room.emit('emote',{e:k}).catch(()=>{});
  else { const e=EMOTES.find(x=>x[0]===k); toast(me.nick+e[2]); }

function setAnim(ent, a, ms){ if(ent.seat>=0 && a!=='sit' && !['cheers','wave','heart'].includes(a)) return; ent.anim=a; ent.animUntil = ms===Infinity? Infinity : performance.now()+ms; }

/* ---- seats ---- */
function seatTaken(i){ for(const e of ents.values()) if(e.seat===i) return true; return false; }
function sitAt(i){
  const s=SEATS[i]; if(!s) return;
  if(seatTaken(i)){ toast('이미 누가 앉아 있어요'); return; }
  me.seat=i; me.x=s.x; me.z=s.z; me.ry=s.ry; me.target=null; me.anim='sit'; me.animUntil=Infinity;
  pushPresence(true); renderEmotes();
}
function standUp(){
  if(me.seat<0) return; const s=SEATS[me.seat]; me.seat=-1; me.x=s.ax; me.z=s.az; me.anim='idle'; me.animUntil=0; pushPresence(true);
}
function sitNearest(){
  let best=-1, bd=3.4;
  SEATS.forEach((s,i)=>{ if(!!s.dark!==!!me.dk || seatTaken(i)) return; const d=Math.hypot(s.x-me.x,s.z-me.z); if(d<bd){ bd=d; best=i; } });
  if(best<0){ setAnim(me,'sit',Infinity); me.floorSit=true; pushPresence(true); renderEmotes(); toast('근처에 빈 의자가 없어서 바닥에 앉았어요'); return; }
  walkTo(SEATS[best].ax, SEATS[best].az, ()=>sitAt(best));
}
function walkTo(x,z,cb){ if(me.seat>=0) standUp(); me.target={x,z}; me.onArrive=cb||null; }

/* ================= Network ================= */
function nickOf(peer){ if(room && peer===room.uid) return me.nick; const e=ents.get(peer); return e? e.nick : '누군가'; }
let lastSent=0, lastPresKey='';
function presenceObj(){
  return {nick:me.nick, look:me.look, x:+me.x.toFixed(2), z:+me.z.toFixed(2), ry:+me.ry.toFixed(2), anim:me.anim, h:me.hold||'', s:me.seat, cd:me.cd||null, dk:!!me.dk};
}
function pushPresence(force){
  if(!room || !me) return; const now=performance.now();
  if(!force && now-lastSent<140) return;
  const p = presenceObj(); const key = JSON.stringify(p); if(key===lastPresKey) return; lastPresKey=key; lastSent=now;
  room.presence(p).catch(()=>{});
}
function applyVisibility(e){ const vis = !!e.dk === !!(me && me.dk); e.root.visible = vis; e.hidden = !vis; if(e.cdMesh) e.cdMesh.visible = true; }
function upsertPeer(p){
  if(p.sameTab || p.kind!=='viewer') return;
  const pr = p.presence||{}; const nick = cleanNick(pr.nick);
  if(!nick){ const e=ents.get(p.peer); if(e){ removeEntity(e); ents.delete(p.peer);} return; }
  let e = ents.get(p.peer);
  if(!e){ e = makeEntity({nick, look:pr.look, peer:p.peer}); e.x=e.tx=+pr.x||0; e.z=e.tz=+pr.z||0; ents.set(p.peer,e); if(!pr.dk) toast(`${nick}님이 들어왔어요`); }
  else { rebuildLook(e, pr.look); if(e.nick!==nick){ e.nick=nick; e.nameEl.textContent=nick; } }
  const inDark = !!pr.dk;
  if(inDark!==e.dk && !e.first){ /* teleport across rooms */ e.x=+pr.x||0; e.z=+pr.z||0; }
  e.dk = inDark; e.first=false;
  e.tx=clamp(Number(pr.x)||0,-17,11); e.tz=clamp(Number(pr.z)||0,-9,9); e.tr=Number(pr.ry)||0;
  const okAnim = EMOTES.some(x=>x[0]===pr.anim) || ['walk','throw','sit'].includes(pr.anim);
  e.anim = okAnim? pr.anim : 'idle';
  e.hold = DRINKS.some(d=>d[0]===pr.h) ? pr.h : null;
  const s = Number.isInteger(pr.s) ? pr.s : -1; e.seat = (s>=0 && s<SEATS.length) ? s : -1;
  if(e.seat>=0){ const st=SEATS[e.seat]; e.tx=st.x; e.tz=st.z; e.tr=st.ry; }
  setCounterDrink(e, pr.cd && typeof pr.cd==='object' ? {k:String(pr.cd.k||''), x:Number(pr.cd.x)||0} : null);
  applyVisibility(e);
}
function updateCount(){
  let main=0; for(const e of ents.values()) if(!e.dk) main++;
  $('#countChip').textContent = connected ? `${ents.size+1}명 접속` : '혼자 둘러보는 중';
  $('#connDot').classList.toggle('on', connected);
}
async function connectRoom(){
  try{ room = await window.makeFirebaseRoom(); }catch(e){ room=null; updateCount(); toast(e && e.message==='no-config' ? 'Firebase 설정이 아직 없어서 혼자 둘러보는 모드예요' : '서버에 연결하지 못했어요. 혼자 둘러보는 모드예요'); console.error(e); Darts.attach(); return; }
  myPeer = room.uid;
  const fail = ()=>{ connected=false; updateCount(); };
  room.onConnection(c=>{ connected=c; updateCount(); if(c){ lastPresKey=''; pushPresence(true); } }, fail);
  room.onPeers(ch=>{
    for(const p of ch.joined) upsertPeer(p);
    for(const p of ch.updated) upsertPeer(p);
    for(const p of ch.left){ const e=ents.get(p.peer); if(e){ if(!e.dk) toast(`${e.nick}님이 나갔어요`); removeEntity(e); ents.delete(p.peer);} }
    updateCount();
  }, fail);
  room.on('chat', m=>{ const text=String((m.data||{}).text||'').slice(0,140).trim(); if(!text) return;
    const ent = m.sameTab? me : ents.get(m.peer); const nick = m.sameTab? me.nick : nickOf(m.peer);
    if(ent && !ent.hidden) say(ent, text); addLog(nick, text, m.sameTab); });
  room.on('emote', m=>{ const k=(m.data||{}).e; const e=EMOTES.find(x=>x[0]===k); if(!e) return;
    const ent = m.sameTab? me : ents.get(m.peer); if(ent && ent.hidden) return;
    toast((m.sameTab? me.nick : nickOf(m.peer))+e[2]);
    if(!m.sameTab && k==='heart' && ent) floatAt(ent,'♥'); });
  room.on('drink', m=>{ const d=m.data||{}; if(!DRINKS.some(x=>x[0]===d.d)) return;
    const from = m.sameTab? me.nick : nickOf(m.peer);
    if(d.to===myPeer && !m.sameTab){ toast(`${from}님이 ${drinkName(d.d)} 한 잔을 보냈어요`); me.hold=d.d; setAnim(me,'cheers',2400); pushPresence(true); renderEmotes(); const ent=ents.get(m.peer); if(ent && !ent.hidden) floatAt(ent,'♥'); }
    else toast(`${from}님이 ${nickOf(d.to)}님에게 ${drinkName(d.d)}을 보냈어요`); });
  room.on('invite', m=>{ const d=m.data||{}; if(m.sameTab || d.to!==myPeer) return; const code=String(d.code||''); if(!/^os-[a-z0-9]{8}$/.test(code)) return;
    if(os || pendingInvite || me.dk){ room.emit('decline',{to:m.peer,code}).catch(()=>{}); return; }
    const from=nickOf(m.peer);
    showModal(box=>{ const h=document.createElement('h3'); h.textContent='원샷 룸 초대'; const p=document.createElement('p'); p.textContent=`${from}님이 둘만의 원샷 룸에서 한 잔 하자고 해요. 대화는 두 사람에게만 보여요.`;
      const row=document.createElement('div'); row.className='row'; const no=document.createElement('button'); no.className='btn-ghost'; no.type='button'; no.textContent='다음에요'; const yes=document.createElement('button'); yes.className='btn-brass'; yes.type='button'; yes.textContent='수락';
      no.onclick=()=>{ hideModal(); room.emit('decline',{to:m.peer,code}).catch(()=>{}); };
      yes.onclick=()=>{ hideModal(); room.emit('accept',{to:m.peer,code}).then(()=>enterOneShot(code,m.peer,1)).catch(()=>toast('수락을 보내지 못했어요')); };
      row.append(no,yes); box.append(h,p,row); setTimeout(()=>yes.focus(),30); });
  });
  room.on('accept', m=>{ const d=m.data||{}; if(d.to!==myPeer || !pendingInvite || d.code!==pendingInvite.code) return; const p=pendingInvite; pendingInvite=null; hideModal(); enterOneShot(p.code, m.peer, 0); });
  room.on('decline', m=>{ const d=m.data||{}; if(d.to!==myPeer || !pendingInvite || d.code!==pendingInvite.code) return; pendingInvite=null; hideModal(); toast(`${nickOf(m.peer)}님이 지금은 어렵대요`); });
  Dark.watch();
  Darts.attach();
}
function invite(ent){
  if(!room||!connected||os) return;
  const code = 'os-' + rid(8);
  pendingInvite = {code, to:ent.peer};
  room.emit('invite',{to:ent.peer, code}).catch(()=>{ pendingInvite=null; toast('초대를 보내지 못했어요'); });
  showModal(box=>{ const h=document.createElement('h3'); h.textContent='초대를 보냈어요'; const p=document.createElement('p'); p.textContent=`${ent.nick}님의 답을 기다리는 중이에요.`; const row=document.createElement('div'); row.className='row'; const c=document.createElement('button'); c.className='btn-ghost'; c.type='button'; c.textContent='초대 취소'; c.onclick=()=>{ pendingInvite=null; hideModal(); }; row.append(c); box.append(h,p,row); });
  setTimeout(()=>{ if(pendingInvite && pendingInvite.code===code){ pendingInvite=null; hideModal(); toast('응답이 없어 초대를 닫았어요'); } }, 45000);
}
function addPm(kind, text){ const d=document.createElement('div'); d.className='pm '+kind; d.textContent=text; const box=$('#osMsgs'); box.appendChild(d); box.scrollTop=box.scrollHeight; }
async function enterOneShot(code, partner, seat){
  if(os) return;
  let nr; try{ nr = await room.join(code); }catch(e){ toast('원샷 룸을 열지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
  const partnerNick = nickOf(partner);
  os = {nr, code, partner, partnerNick, unsubs:[], warned:false};
  $('#osMsgs').textContent=''; $('#osTitle').textContent = `원샷 룸 · ${partnerNick}`;
  addPm('sys', `${partnerNick}님과 둘만의 자리예요. 대화는 두 사람만 볼 수 있어요.`);
  os.unsubs.push(nr.on('pm', m=>{ const text=String((m.data||{}).text||'').slice(0,300).trim(); if(!text) return; if(m.sameTab) addPm('me',text); else if(m.peer===os.partner) addPm('them',text); }));
  os.unsubs.push(nr.onPeers(ch=>{ if(!os) return;
    if(ch.left.some(p=>p.peer===os.partner)) addPm('sys', `${os.partnerNick}님이 원샷 룸을 나갔어요.`);
    if(ch.joined.some(p=>p.peer===os.partner)) addPm('sys', `${os.partnerNick}님이 자리에 앉았어요.`);
  }));
  const b = BOOTHS[[...code].reduce((a,c)=>a+c.charCodeAt(0),0)%BOOTHS.length];
  if(me.seat>=0) standUp();
  const si = b.seats[seat===0?0:1]; const st=SEATS[si]; me.seat=si; me.x=st.x; me.z=st.z; me.ry=st.ry; me.target=null; me.anim='sit'; me.animUntil=Infinity;
  document.body.classList.add('in-oneshot'); $('#oneshot').hidden=false; pushPresence(true); renderEmotes();
  setTimeout(()=>$('#osInput').focus(),50);
}
function leaveOneShot(){
  if(!os) return; os.unsubs.forEach(u=>{ try{u();}catch(e){} }); os.nr.leave().catch(()=>{}); os=null;
  $('#oneshot').hidden=true; document.body.classList.remove('in-oneshot'); standUp(); renderEmotes();
}
$('#osLeave').addEventListener('click', leaveOneShot);
$('#osForm').addEventListener('submit', e=>{ e.preventDefault(); const i=$('#osInput'); const text=i.value.trim(); if(!text||!os) return;
  if(!os.nr.connected()){ addPm('sys','연결이 잠시 끊겼어요. 잠시 후 다시 보내 주세요.'); return; }
  os.nr.emit('pm',{text}).then(()=>{ i.value=''; }).catch(()=>addPm('sys','메시지를 보내지 못했어요.')); });

/* ================= Dark room ================= */
const Dark = {
  slots:{}, slotKey:null, sess:null, unsub:null, busy:false, cool:0,
  ref(){ return room && room.fb ? room.fb.db.ref('darkroom') : null; },
  watch(){ const r=this.ref(); if(!r) return; r.child('slots').on('value', s=>{ this.slots=s.val()||{}; this.render(); this.checkPartner(); }); },
  count(){ const now = room&&room.fb ? room.fb.now() : Date.now(); return ['s1','s2'].filter(k=>this.slots[k] && this.slots[k].uid && !(this.slots[k].t && now-this.slots[k].t>3*3600*1000)).length; },
  render(){ const el=$('#darkSign'); if(el) el.textContent = `다크룸 · ${room? this.count() : (me&&me.dk?1:0)}/2`; },
  partnerUid(){ for(const k of ['s1','s2']){ const v=this.slots[k]; if(v && v.uid && (!room || v.uid!==room.uid)) return v.uid; } return null; },
  checkPartner(){ if(!me || !me.dk) return; const p=this.partnerUid(); if(p!==this.lastPartner){ if(p) toast(`${nickOf(p)}님이 다크룸에 들어왔어요`); else if(this.lastPartner) toast('상대가 다크룸을 나갔어요'); this.lastPartner=p; } },
  async enter(){
    if(this.busy || me.dk || performance.now()<this.cool) return; this.busy=true;
    try{
      if(os) leaveOneShot();
      if(room && room.fb){
        const fb=room.fb, uid=fb.uid, slots=fb.db.ref('darkroom/slots');
        const v=(await slots.once('value')).val()||{};
        const other = ['s1','s2'].map(k=>v[k]).find(x=>x && x.uid && x.uid!==uid && !(x.t && fb.now()-x.t>3*3600*1000));
        const sess = other ? other.sess : rid(10);
        let got=null;
        for(const k of ['s1','s2']){
          const r=slots.child(k);
          const res = await r.transaction(cur=>{ if(cur && cur.uid && cur.uid!==uid && !(cur.t && fb.now()-cur.t>3*3600*1000)) return; return {uid, sess, t:fb.now()}; });
          if(res.committed){ got=k; r.onDisconnect().remove(); break; }
        }
        if(!got){ toast('다크룸이 가득 찼어요 (2/2). 조금 뒤에 다시 와 주세요.'); this.bounce(); return; }
        this.slotKey=got; this.sess=sess;
        const q = fb.db.ref('darkroom/msgs/'+sess).orderByChild('t').startAt(fb.now()-1000);

/* ================= Darts ================= */
const Darts = {
  state:null, local:false, lastThrows:0, lastStatus:null, lastTurnKey:'',
  id(){ return room ? room.uid : 'me'; },
  now(){ return room && room.fb ? room.fb.now() : Date.now(); },
  ref(){ return room && room.fb ? room.fb.db.ref('lounge/darts') : null; },
  attach(){

  },
  async tx(fn){

  },
  fresh(cur){ const now=this.now(); if(!cur || !cur.status || (cur.t && now-cur.t>15*60*1000)) return {status:'lobby', players:{}, t:now}; return cur; },
  join(){ const id=this.id(), nick=me.nick;

  leave(){ const id=this.id();
    return this.tx(cur=>{ if(!cur || !cur.players || !cur.players[id]) return; delete cur.players[id];
      if(cur.status==='playing'){ const order=(cur.order||[]); const idx=order.indexOf(id); if(idx>=0){ order.splice(idx,1); if(idx<cur.turn) cur.turn--; if(cur.turn>=order.length){ cur.turn=0; cur.round=(cur.round||1)+1; cur.dart=0; } else if(idx===cur.turn) cur.dart=0; } cur.order=order;
        if(order.length<(this.local?1:2)){ cur.status='lobby'; cur.order=null; cur.throws=null; } else if(cur.round>3) cur.status='done'; }
      cur.t=this.now(); return cur; }); },
  start(){ const id=this.id();
    return this.tx(cur=>{ if(!cur || cur.status!=='lobby' || !cur.players || !cur.players[id]) return; const ids=Object.keys(cur.players).sort((a,b)=>cur.players[a].j-cur.players[b].j); if(ids.length<(this.local?1:2)) return;
      cur.status='playing'; cur.order=ids; cur.turn=0; cur.dart=0; cur.round=1; cur.throws=[]; cur.t=this.now(); return cur; }); },
  throwAt(x,y){ const id=this.id(); const sc=scoreAt(x,y);
    return this.tx(cur=>{ if(!cur || cur.status!=='playing' || !cur.order || cur.order[cur.turn]!==id) return;
      const th = Array.isArray(cur.throws)? cur.throws : (cur.throws? Object.values(cur.throws) : []);
      th.push({u:id, r:cur.round, x:+x.toFixed(3), y:+y.toFixed(3), s:sc.s, l:sc.l}); cur.throws=th;
      cur.dart++; if(cur.dart>=3){ cur.dart=0; cur.turn++; if(cur.turn>=cur.order.length){ cur.turn=0; cur.round++; } }
      if(cur.round>3) cur.status='done'; cur.t=this.now(); return cur; }).then(ok=>({ok, sc})); },
  skip(){ return this.tx(cur=>{ if(!cur || cur.status!=='playing' || this.now()-cur.t<60000) return; cur.dart=0; cur.turn++; if(cur.turn>=cur.order.length){ cur.turn=0; cur.round++; } if(cur.round>3) cur.status='done'; cur.t=this.now(); return cur; }); },
  reset(){ return this.tx(cur=>{ if(!cur) return; return {status:'lobby', players:cur.players||{}, t:this.now()}; }); },
  throwsOf(s){ return s && s.throws ? (Array.isArray(s.throws)? s.throws : Object.values(s.throws)) : []; },
  onState(s){
    this.state = s;
    const th = this.throwsOf(s);
    if(!this.inited){ this.inited=true; this.lastThrows=th.length; this.lastStatus=s?s.status:null; if(s && s.order) this.lastTurnKey=`${s.round}-${s.turn}`; }

    if(th.length>this.lastThrows && s && s.status!=='lobby'){
      const t = th[th.length-1]; const ent = t.u===this.id()? me : ents.get(t.u);
      if(t.u!==this.id()){ toast(`${nickOf(t.u)} · ${t.l} (${t.s}점)`); if(ent && !ent.hidden){ ent.anim='throw'; ent.animUntil=performance.now()+700; } }

      const key = `${s.round}-${s.turn}`; if(key!==this.lastTurnKey){ this.lastTurnKey=key; if(this.isIn(s)){ toast('다트, 내 차례예요'); goToLine(); this.open(); } }

  isIn(s){ return !!(s && s.players && s.players[this.id()]); },
  totals(s){ const tot={}; for(const id of (s.order||Object.keys(s.players||{}))) tot[id]=[0,0,0,0]; for(const t of this.throwsOf(s)){ if(!tot[t.u]) continue; tot[t.u][t.r-1]+=t.s; tot[t.u][3]+=t.s; } return tot; },
  winner(s){ const tot=this.totals(s); let best=null; for(const id in tot){ if(!best || tot[id][3]>best.total) best={id,total:tot[id][3]}; } return best; },
  sign(s){ const el=$('#dartSign'); if(!el) return; const n = s && s.players ? Object.keys(s.players).length : 0;
    el.textContent = !s || s.status==='lobby' ? `다트 · ${n}/3 참가` : (s.status==='playing' ? `다트 · ${s.round}/3 라운드` : '다트 · 경기 종료'); },
  draw3D(s){

  },
  open(){ $('#card').dataset.kind='darts'; this.render(); },
  render(){

      card.appendChild(slots);

      const joined = players.some(p=>p[0]===id);
      if(!joined){ const b=document.createElement('button'); b.className='btn-brass'; b.type='button'; b.textContent='참가하기'; b.disabled = players.length>=3; b.onclick=async()=>{ b.disabled=true; const ok=await this.join(); if(!ok) toast('자리가 없거나 이미 경기 중이에요'); else goToLine(); }; row.appendChild(b); }
      else {
        const lv=document.createElement('button'); lv.className='btn-ghost'; lv.type='button'; lv.textContent='빠지기'; lv.onclick=()=>this.leave(); row.appendChild(lv);
        const st=document.createElement('button'); st.className='btn-brass'; st.type='button'; st.textContent= this.local ? '연습 시작' : '게임 시작'; st.disabled = players.length < (this.local?1:2); st.onclick=()=>this.start(); row.appendChild(st);
      }

      const hint=document.createElement('div'); hint.className='sub'; hint.style.marginTop='0'; hint.textContent = this.local ? '혼자 모드에서는 연습 게임만 할 수 있어요.' : '2~3명이 모이면 시작할 수 있어요. 3명이 차면 바로 시작해 보세요.'; card.appendChild(hint);

/* Aim overlay */
const Aim = {
  raf:0, t:0, busy:false,
  open(){ $('#aim').hidden=false; $('#aimResult').textContent=''; this.busy=false; this.t=Math.random()*10; const s=Darts.state; $('#aimInfo').textContent = s && s.status==='playing' ? `${s.round}/3 라운드 · ${s.dart+1}/3번째 다트 · 원하는 순간에 탭하세요` : '원하는 순간에 탭하세요';
    const cv=$('#aimCanvas'); this.ctx=cv.getContext('2d'); this.board=document.createElement('canvas'); this.board.width=this.board.height=600; drawBoard(this.board.getContext('2d'),600); this.loop(); },
  close(){ $('#aim').hidden=true; cancelAnimationFrame(this.raf); },
  pos(){ const t=this.t; return {x:.5*Math.sin(t*1.25)+.18*Math.sin(t*3.3), y:.45*Math.sin(t*1.63+1)+.15*Math.cos(t*2.7)}; },
  loop(){
    const g=this.ctx, S=600, c=S/2, R0=S*.42; let last=performance.now();
    const fr = (n)=>{ this.raf=requestAnimationFrame(fr); const dt=(n-last)/1000; last=n; if(!this.busy) this.t+=dt;
      g.clearRect(0,0,S,S); g.drawImage(this.board,0,0);
      for(const d of (this.marks||[])){ g.fillStyle=d.c; g.beginPath(); g.arc(c+d.x*R0,c+d.y*R0,7,0,Math.PI*2); g.fill(); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke(); }
      if(!this.busy){ const p=this.pos(); const x=c+p.x*R0, y=c+p.y*R0; g.strokeStyle='#f1d08a'; g.lineWidth=3; g.beginPath(); g.arc(x,y,18,0,Math.PI*2); g.moveTo(x-28,y); g.lineTo(x+28,y); g.moveTo(x,y-28); g.lineTo(x,y+28); g.stroke(); }
    };
    this.raf=requestAnimationFrame(fr);
    const s=Darts.state; const order=(s&&s.order)||[]; const ci=Math.max(0,order.indexOf(Darts.id()));
    this.marks = Darts.throwsOf(s).filter(t=>t.u===Darts.id() && s && t.r===s.round).map(t=>({x:t.x,y:t.y,c:DCOLORS[ci%3]}));
  },
  async fire(){
    if(this.busy) return; const s=Darts.state; if(!s || s.status!=='playing' || !s.order || s.order[s.turn]!==Darts.id()){ this.close(); return; }
    this.busy=true; const p=this.pos(); const gauss=()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

    me.anim='throw'; me.animUntil=performance.now()+700; pushPresence(true);
    const order=s.order; const ci=Math.max(0,order.indexOf(Darts.id())); (this.marks=this.marks||[]).push({x,y,c:DCOLORS[ci%3]});
    const res = await Darts.throwAt(x,y);
    $('#aimResult').textContent = res.ok ? `${res.sc.l} · ${res.sc.s}점` : '저장하지 못했어요';
    setTimeout(()=>{ const st=Darts.state; if(st && st.status==='playing' && st.order && st.order[st.turn]===Darts.id() && !$('#aim').hidden){ this.busy=false; $('#aimResult').textContent=''; $('#aimInfo').textContent=`${st.round}/3 라운드 · ${st.dart+1}/3번째 다트 · 원하는 순간에 탭하세요`; if(st.dart===0) this.marks=[]; } else { this.close(); Darts.open(); } }, 1100);
  }
};

const keys = new Set();
addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); e.preventDefault(); } if(k==='enter' && !$('#hud').hidden){ (os?$('#osInput'):$('#chatInput')).focus(); } if(k==='escape'){ closeCard(); Aim.close(); } });

function setupPointer(el){
  let down=null;
  el.addEventListener('pointerdown', e=>{ down={x:e.clientX,y:e.clientY,moved:false}; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e=>{ if(!down) return; if(Math.abs(e.clientX-down.x)>8 || down.moved){ down.moved=true; camYaw = clamp(camYaw - (e.clientX-(down.lx??down.x))*.006, -1.05, 1.05); down.lx=e.clientX; } });
  el.addEventListener('pointerup', e=>{ if(down && !down.moved) tap(e.clientX,e.clientY); down=null; });
  el.addEventListener('wheel', e=>{ camDist = clamp(camDist + e.deltaY*.01, 5.5, 14); }, {passive:true});
}
function tap(cx,cy){
  const ndc = new THREE.Vector2(cx/innerWidth*2-1, -(cy/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const visEnts = [...ents.values()].filter(e=>!e.hidden).map(e=>e.root);
  const objs = [bartender.root, ...visEnts, ...seatPickers, boardMesh, doorDark, doorVers]; if(me.cdMesh) objs.push(me.cdMesh);
  const hits = raycaster.intersectObjects(objs, true);
  const eh = hits.find(h=>{ const en=h.object.userData.ent; return en && en!==me && !(en.npc && me.dk); });
  if(eh){ openCard(eh.object.userData.ent); return; }
  for(const h of hits){
    const o=h.object, u=o.userData;
    if(u.ent && u.ent!==me){ if(u.ent.npc && me.dk) continue; openCard(u.ent); return; }
    if(u.myDrink){ closeCard(); pickCounterDrink(); return; }
    if(u.darts){ if(me.dk) continue; Darts.open(); return; }
    if(u.door==='vers'){ if(me.dk) continue; walkTo(9.0,5.5, openVers); return; }
    if(u.door==='dark'){ if(me.dk){ walkTo(DARK.x2-.2,(DARK.doorZ1+DARK.doorZ2)/2); } else walkTo(-9.6,(DARK.doorZ1+DARK.doorZ2)/2); closeCard(); return; }
    if(u.seat!==undefined){ const s=SEATS[u.seat]; if(!!s.dark!==!!me.dk) continue; closeCard(); if(seatTaken(u.seat)){ toast('이미 누가 앉아 있어요'); return; } if(me.seat===u.seat) return; walkTo(s.ax, s.az, ()=>sitAt(u.seat)); return; }
  }
  closeCard();
  if(os && me.seat>=0) return;
  const f = raycaster.intersectObjects(floors)[0];
  if(f){ walkTo(f.point.x, f.point.z); marker.position.set(f.point.x, groundY(f.point.x,f.point.z)+.02, f.point.z); marker.visible=true; marker.userData.t=0; if(me.floorSit){ me.floorSit=false; me.anim='idle'; renderEmotes(); } }
}

/* ================= Loop ================= */
const tmpV = new THREE.Vector3();
function step(){
  requestAnimationFrame(step);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime, now=performance.now();
  if($('#world').hidden) return;
  let mx=0, mz=0;
  if(keys.has('w')||keys.has('arrowup')) mz-=1; if(keys.has('s')||keys.has('arrowdown')) mz+=1;
  if(keys.has('a')||keys.has('arrowleft')) mx-=1; if(keys.has('d')||keys.has('arrowright')) mx+=1;
  let moving=false;
  const sp = 3.4*dt;
  if((mx||mz) && !(os && me.seat>=0)){
    if(me.seat>=0){ standUp(); renderEmotes(); } if(me.floorSit){ me.floorSit=false; renderEmotes(); }
    me.target=null; me.onArrive=null; const s=Math.sin(camYaw), c=Math.cos(camYaw); const dx = mx*c + mz*s, dz = -mx*s + mz*c; const l=Math.hypot(dx,dz);
    moving = tryMove(me, me.x+dx/l*sp, me.z+dz/l*sp); me.ry = lerpAngle(me.ry, Math.atan2(dx,dz), Math.min(1,dt*12));
  } else if(me.target){
    const dx=me.target.x-me.x, dz=me.target.z-me.z, d=Math.hypot(dx,dz);
    if(d<.08){ me.target=null; const cb=me.onArrive; me.onArrive=null; if(cb) cb(); }
    else { const st=Math.min(d,sp); moving = tryMove(me, me.x+dx/d*st, me.z+dz/d*st); me.ry = lerpAngle(me.ry, Math.atan2(dx,dz), Math.min(1,dt*12)); if(!moving){ me.target=null; const cb=me.onArrive; me.onArrive=null; if(cb && d<.9) cb(); } }
  }
  // door triggers
  const dz0=DARK.doorZ1+.15, dz1=DARK.doorZ2-.15;
  if(!me.dk && me.x < -9.38 && me.z>dz0 && me.z<dz1) Dark.enter();
  else if(me.dk && me.x > DARK.x2-.12 && me.z>dz0 && me.z<dz1 && now>Dark.cool) Dark.leave();
  if(moving){ if(me.anim!=='walk'){ me.anim='walk'; me.animUntil=0; } }
  else if(me.anim==='walk' || (me.animUntil!==Infinity && me.animUntil && now>me.animUntil)){ me.anim = me.seat>=0 || me.floorSit ? 'sit' : 'idle'; me.animUntil = me.anim==='sit'? Infinity : 0; }
  pushPresence(false);
  place(me, dt, t);
  for(const e of ents.values()){
    e.x += (e.tx-e.x)*Math.min(1,dt*8); e.z += (e.tz-e.z)*Math.min(1,dt*8); e.ry = lerpAngle(e.ry, e.tr, Math.min(1,dt*10));
    place(e, dt, t);
  }
  // bartender walks behind counter
  const bdx = bartender.tx - bartender.x;
  if(Math.abs(bdx)>.04){ bartender.x += Math.sign(bdx)*Math.min(Math.abs(bdx), 2.6*dt); bartender.ry = lerpAngle(bartender.ry, bdx>0? Math.PI/2 : -Math.PI/2, Math.min(1,dt*10)); if(bartender.anim!=='mix') bartender.anim='walk'; }
  else { bartender.ry = lerpAngle(bartender.ry, 0, Math.min(1,dt*6)); if(bartender.anim==='walk'){ bartender.anim='idle'; } if(bartender.after){ const f=bartender.after; bartender.after=null; f(); } }
  if(bartender.animUntil && now>bartender.animUntil){ bartender.anim='idle'; bartender.animUntil=0; }
  place(bartender, dt, t);
  const gy = groundY(me.x,me.z);
  const hf = me.dk ? .95 : .72;
  const camTarget = tmpV.set(me.x + Math.sin(camYaw)*camDist, gy + camDist*hf, me.z + Math.cos(camYaw)*camDist);
  camera.position.lerp(camTarget, Math.min(1,dt*(me.camSnap? 30 : 5))); me.camSnap=false;
  camera.lookAt(me.x, gy+1, me.z);
  if(scene.userData.disco) scene.userData.disco.rotation.y += dt*.8;
  if(lights.dark) lights.dark.intensity = (me.dk?1.8:1.3) + Math.sin(t*1.3)*.25;
  if(marker.visible){ marker.userData.t+=dt; marker.scale.setScalar(1+marker.userData.t*1.5); marker.material.opacity=Math.max(0,.8-marker.userData.t*1.2); if(marker.userData.t>.7) marker.visible=false; }
  renderer.render(scene,camera);
  for(const e of [me, bartender, ...ents.values()]) placeTag(e, now);
  for(const s of signs) placeSign(s);
  const z = zoneName(me.x,me.z,me.dk); if(z!==step.zone){ step.zone=z; $('#zoneChip').textContent=z; }
}
function place(e, dt, t){
  const sy = e.seat>=0 ? seatY(e.seat) : null;
  e.root.position.set(e.x, sy!==null ? sy : groundY(e.x,e.z), e.z); e.root.rotation.y = e.ry;
  if(e.seat>=0 && e.anim!=='cheers' && e.anim!=='wave' && e.anim!=='heart') e.anim='sit';
  animChar(e, dt, t);
}
function placeTag(e, now){
  if(e.bubbleT && now>e.bubbleT){ e.bubble.hidden=true; e.bubbleT=0; }
  if(e.hidden || (e.npc && me.dk)){ e.tag.style.display='none'; return; }
  const base = e.seat>=0 ? seatY(e.seat) + 1.55 : 1.78+groundY(e.x,e.z)+(e.anim==='sit'?-.2:0);
  const v = tmpV.set(e.x, base, e.z).project(camera);
  if(v.z>1){ e.tag.style.display='none'; return; }
  e.tag.style.display=''; e.tag.style.transform = `translate(-50%,-100%) translate(${((v.x+1)/2*innerWidth).toFixed(1)}px,${((1-v.y)/2*innerHeight).toFixed(1)}px)`;
}
function placeSign(s){
  if(me.dk){ s.tag.style.display='none'; return; }
  const v = tmpV.set(s.x, s.y, s.z).project(camera);
  if(v.z>1 || Math.hypot(s.x-me.x, s.z-me.z)>11){ s.tag.style.display='none'; return; }
  s.tag.style.display=''; s.tag.style.transform = `translate(-50%,-100%) translate(${((v.x+1)/2*innerWidth).toFixed(1)}px,${((1-v.y)/2*innerHeight).toFixed(1)}px)`;
}
function tryMove(e,nx,nz){
  const dk = !!e.dk;
  if(!dk && nx < -9.5 && nz>DARK.doorZ1+.15 && nz<DARK.doorZ2-.15 && nx > -9.6){ e.x=nx; e.z=nz; return true; }
  if(!blocked(nx,nz,dk)){ e.x=nx; e.z=nz; return true; }
  if(!blocked(nx,e.z,dk)){ e.x=nx; return true; }
  if(!blocked(e.x,nz,dk)){ e.z=nz; return true; }
  return false;
}
function lerpAngle(a,b,f){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*f; }

/* ================= Enter / leave ================= */
function resize(){ if(!renderer) return; renderer.setSize(innerWidth, innerHeight, false); camera.aspect=innerWidth/innerHeight; camera.fov = camera.aspect<.8? 58:45; camera.updateProjectionMatrix(); }
function enter(){
  const nick = cleanNick(nickInput.value); if(nick.length<2 || !adult.checked) return;
  Music.unlock();
  store.set('bc-nick', nick); store.set('bc-look', look);
  $('#entrance').hidden=true; $('#world').hidden=false; $('#tags').hidden=false; $('#hud').hidden=false;
  if(pv) pv.run=false;
  if(!worldBuilt){
    worldBuilt=true;
    renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
    $('#world').appendChild(renderer.domElement);
    camera = new THREE.PerspectiveCamera(45,1,.1,80);
    buildWorld();
    marker = new THREE.Mesh(new THREE.RingGeometry(.22,.3,28), new THREE.MeshBasicMaterial({color:0xf1d08a,transparent:true,opacity:.8,depthWrite:false})); marker.rotation.x=-Math.PI/2; marker.visible=false; scene.add(marker);
    me = makeEntity({nick, look, mine:true}); me.x=-1.2+Math.random()*2; me.z=4.8+Math.random()*1.5; me.ry=Math.PI;
    camera.position.set(me.x, 7, me.z+9.5);
    setupPointer(renderer.domElement); renderEmotes();
    addEventListener('resize', resize); resize();
    step(); connectRoom();
  } else {
    me.nick=nick; me.nameEl.textContent=nick; rebuildLook(me, look); lastPresKey=''; pushPresence(true);
  }
  setTimeout(()=>say(bartender, `어서 오세요, ${nick}님. 버드케이지입니다. 저를 탭하면 한 잔 만들어 드려요.`), 700);
  updateCount();
}
$('#enterBtn').addEventListener('click', enter);
nickInput.addEventListener('keydown', e=>{ if(e.key==='Enter') enter(); });
$('#dressBtn').addEventListener('click', ()=>{
  if(os) leaveOneShot(); if(me && me.dk) Dark.leave();
  closeCard(); Aim.close(); $('#hud').hidden=true; $('#tags').hidden=true; $('#world').hidden=true; $('#entrance').hidden=false;
  if(pv && !pv.run){ pv.run=true; previewLoop(); }
  setPreviewChar(); validEntry();
});
})();
</script>
